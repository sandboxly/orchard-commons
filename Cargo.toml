[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Stephan Lengl <lengl.stephan@gmail.com>"]
rust-version = "1.85"

[workspace.dependencies]
orchard-grid = { path = "crates/orchard-grid" }
orchard-theme = { path = "crates/orchard-theme" }
orchard-kit = { path = "crates/orchard-kit" }
orchard-metadata = { path = "crates/orchard-metadata" }
thiserror = "2"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
