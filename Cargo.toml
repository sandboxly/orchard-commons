[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Stephan Lengl <lengl.stephan@gmail.com>"]
rust-version = "1.90"
repository = "https://github.com/sandboxly/orchard-commons"

[workspace.dependencies]
orchard-grid = { path = "crates/orchard-grid" }
orchard-theme = { path = "crates/orchard-theme" }
orchard-kit = { path = "crates/orchard-kit" }
orchard-metadata = { path = "crates/orchard-metadata" }
orchard-shell = { path = "crates/orchard-shell" }
thiserror = "2"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
