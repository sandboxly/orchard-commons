[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["Stephan Lengl <lengl.stephan@gmail.com>"]
rust-version = "1.90"
repository = "https://github.com/sandboxly/orchard-commons"

[workspace.dependencies]
orchard-grid = { path = "crates/orchard-grid" }
orchard-theme = { path = "crates/orchard-theme" }
orchard-kit = { path = "crates/orchard-kit" }
orchard-metadata = { path = "crates/orchard-metadata" }
orchard-shell = { path = "crates/orchard-shell" }
orchard-places = { path = "crates/orchard-places" }
thiserror = "2"
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
# Key order kept as read (bookmark files are written back like the Python version's).
serde_json = { version = "1.0", features = ["preserve_order"] }
uuid = { version = "1.10", features = ["v4"] }
dirs = "6.0"
windows-sys = "0.61"

[profile.dev.package."*"]
opt-level = 2
