[package]
name = "orchard-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The UI kit the Orchard apps share: background tasks, input events, grid widgets, dialog forms and the clipboard"

[features]
default = ["clipboard"]
# `clipboard::text()` reads the system clipboard (without it, it returns None).
clipboard = ["dep:arboard"]

[dependencies]
orchard-grid.workspace = true
orchard-theme.workspace = true
arboard = { version = "3.6", default-features = false, optional = true }
